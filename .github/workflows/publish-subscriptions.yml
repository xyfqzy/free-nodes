name: Publish subscription artifacts

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */2 * * *"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install formatter dependencies
        run: python -m pip install --disable-pip-version-check PyYAML requests
      - name: Download and normalize the two configured sources
        run: |
          curl --fail --location --silent --show-error https://raw.githubusercontent.com/kooker/FreeSubsCheck/main/base64.txt --output /tmp/base64.txt
          curl --fail --location --silent --show-error https://raw.githubusercontent.com/kooker/FreeSubsCheck/main/all.yaml --output /tmp/all.yaml
          python scripts/normalize_subscriptions.py /tmp/base64.txt /tmp/all.yaml docs/subscriptions
      - name: Commit published artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/subscriptions/base64.txt docs/subscriptions/clash.yaml
          git diff --cached --quiet || git commit -m "chore: refresh subscription artifacts"
          git push
